<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品比較 | NiwaShiba</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="header">
    <div class="header-inner container">
      <a href="index.html" class="logo">
        <div class="logo-characters">
          <span class="char-chicken" title="ニワトリ">🐔</span>
          <span class="char-dog" title="芝犬">🐕</span>
        </div>
        <div class="logo-text">
          <span class="logo-name">NiwaShiba</span>
          <span class="logo-tagline">建築資材・商品比較サイト</span>
        </div>
      </a>
      <nav class="nav-desktop">
        <ul>
          <li><a href="index.html">ホーム</a></li>
          <li><a href="index.html#categories">カテゴリー</a></li>
          <li><a href="category/carport.html">カーポート</a></li>
          <li><a href="compare.html" class="active">比較する</a></li>
        </ul>
      </nav>
      <button class="hamburger" id="hamburgerBtn" aria-label="メニュー">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="nav-mobile" id="mobileNav">
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="index.html#categories">カテゴリー</a></li>
        <li><a href="category/carport.html">カーポート</a></li>
        <li><a href="compare.html">比較する</a></li>
      </ul>
    </nav>
  </header>

  <!-- パンくず -->
  <div class="breadcrumb container">
    <a href="index.html">ホーム</a>
    <span>›</span>
    <a href="category/carport.html">カーポート</a>
    <span>›</span>
    <span>比較</span>
  </div>

  <!-- ページ見出し -->
  <div class="page-head container">
    <div class="page-head-text">
      <h1>📋 商品を比較する</h1>
      <p>選択した商品のスペックを並べて比較できます。値が無い項目は「不明」と表示されます。</p>
    </div>
    <div class="page-head-mascot">
      <span class="char-chicken">🐔</span>
      <span class="char-dog">🐕</span>
    </div>
  </div>

  <main class="compare-main container">
    <!-- 商品未選択時 -->
    <div class="compare-empty" id="compareEmpty" hidden>
      <div class="compare-empty-mascot">
        <span class="char-chicken">🐔</span>
        <span class="char-dog">🐕</span>
      </div>
      <p>比較する商品が選択されていません。</p>
      <a href="category/carport.html" class="btn btn-primary">カーポート一覧から選ぶ</a>
    </div>

    <!-- 比較表 -->
    <div class="compare-table-wrap" id="compareTableWrap" hidden>
      <table class="compare-table" id="compareTable"></table>
    </div>
  </main>

  <!-- フッター -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-logo">
        <span class="char-chicken">🐔</span>
        <span class="char-dog">🐕</span>
        <span class="logo-name">NiwaShiba</span>
      </div>
      <p class="footer-copy">&copy; 2026 NiwaShiba. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/fields.js"></script>
  <script src="js/compare.js"></script>
</body>
</html>
