name: 価格を自動更新（楽天API）

# 毎日 21:00 UTC（＝日本時間 6:00）に実行。手動実行も可。
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write   # carport.json をコミット＆プッシュするため

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js を準備
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 楽天APIで価格・画像・リンクを更新
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: node tools/refresh-rakuten.js

      - name: 変更があればコミット＆公開
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "価格自動更新（楽天API） $(date +%Y-%m-%d)"
            git push
            echo "更新を公開しました。"
          else
            echo "変更なし。"
          fi
